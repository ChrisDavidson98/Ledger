<script type="module">
/* ---------------------------------------------------------------
   tests.html — open this in a browser. No install, no build.

   These exist because three of the first four backend redeploys were
   fixing bugs a round-trip check would have caught in a second: a
   score-only round syncing to nowhere, deletions that did not delete,
   and rounds existing as live and archived at once. Each of those was
   verified by hand in a console at the time and then thrown away.
--------------------------------------------------------------- */

import * as B from './src/baseline.js';
import * as M from './src/model.js';
import * as S from './src/sync.js';
import * as C from './src/courses.js';
import * as I from './src/import.js';
import * as H from './src/handicap.js';
import * as E from './src/brief.js';
import * as SCH from './src/schedule.js';
import * as CH from './src/charts.js';
import * as RC from './src/recap.js';
import * as PR from './src/practice.js';
// Only the PURE helpers are called from here. Importing the module is
// safe — it has no side effects at load — but nothing below may read
// or write localStorage, or opening this page would edit real data.
import * as ST from './src/storage.js';
import * as RP from './src/repair.js';
import { SEED_COURSES } from './src/seed.js';

const results = [];
let group = '';

function suite(name) { group = name; }

function check(name, fn) {
  try {
    const problem = fn();
    results.push({ group, name, ok: !problem, why: problem || '' });
  } catch (err) {
    results.push({ group, name, ok: false, why: err.message });
  }
}

const near = (a, b, tol = 0.005) => Math.abs(a - b) <= tol;
const eq = (a, b, what) => (a === b ? null : `${what}: got ${a}, expected ${b}`);

/* --- Helpers to build fixtures ---------------------------------- */

function shot(startLie, startDist, endLie, endDist, extra = {}) {
  return M.newShot({
    shotNum: 1, startLie, startDist,
    endLie: extra.holed ? null : endLie,
    endDist: extra.holed ? null : endDist,
    holed: !!extra.holed, penalty: extra.penalty || 0, miss: extra.miss || null,
    club: extra.club || null,
  });
}

function roundOf(holes, mode = 'full') {
  const r = M.newRound({
    player: 'Test', courseId: 'c', courseName: 'Test GC', teeName: 'Blue',
    layout: 'Front / Back', mode,
    holes: holes.map((h, i) => ({ hole: i + 1, par: h.par, yards: h.yards })),
  });
  holes.forEach((h, i) => {
    if (h.shots) { r.holes[i].shots = h.shots; M.relinkHole(r.holes[i]); }
    if (h.score != null) { r.holes[i].score = h.score; r.holes[i].done = true; }
  });
  return r;
}

/**
 * A four-hole fixture that touches every category — a drive, an
 * approach, a chip and putts — played at somewhere near a mid
 * handicap standard. Used wherever a test needs a round that is
 * plausible rather than one that proves a specific edge.
 */
function mediumRound() {
  return roundOf([
    { par: 4, yards: 395, shots: [
      shot('tee', 395, 'fairway', 155, { miss: 'target' }),
      shot('fairway', 155, 'green', 32, { miss: 'short', club: '7i' }),
      shot('green', 32, 'green', 3),
      shot('green', 3, null, null, { holed: true })] },
    { par: 4, yards: 380, shots: [
      shot('tee', 380, 'rough', 160, { miss: 'left' }),
      shot('rough', 160, 'rough', 16, { miss: 'short' }),
      shot('rough', 16, 'green', 9),
      shot('green', 9, 'green', 2),
      shot('green', 2, null, null, { holed: true })] },
    { par: 3, yards: 165, shots: [
      shot('tee', 165, 'green', 28, { miss: 'long' }),
      shot('green', 28, 'green', 4),
      shot('green', 4, null, null, { holed: true })] },
    { par: 5, yards: 510, shots: [
      shot('tee', 510, 'fairway', 265, { miss: 'target' }),
      shot('fairway', 265, 'fairway', 95, { club: '5W' }),
      shot('fairway', 95, 'green', 26, { miss: 'target', club: 'PW' }),
      shot('green', 26, 'green', 3),
      shot('green', 3, null, null, { holed: true })] },
  ]);
}

/* --- Baseline --------------------------------------------------- */

suite('Baseline');

check('interpolates between table points', () => {
  const v = B.expectedStrokes('fairway', 130);
  return v > 2.85 && v < 2.92 ? null : `got ${v}, expected between 2.85 and 2.92`;
});

check('clamps below and above the table', () => {
  const low = B.expectedStrokes('tee', 1);
  const high = B.expectedStrokes('tee', 9999);
  return low === 2.40 && high === 5.28 ? null : `got ${low} / ${high}`;
});

check('green distances are read as feet', () => {
  // 10ft should be far cheaper than 10 yards would be on any other lie.
  const putt = B.expectedStrokes('green', 10);
  return putt > 1.4 && putt < 1.55 ? null : `got ${putt}`;
});

check('par 3 tee shot classifies as approach', () => eq(
  B.classifyShot({ shotNum: 1, par: 3, startLie: 'tee', startDist: 165, startUnit: 'y' }),
  'app', 'category'));

check('par 4 tee shot classifies as off the tee', () => eq(
  B.classifyShot({ shotNum: 1, par: 4, startLie: 'tee', startDist: 400, startUnit: 'y' }),
  'ott', 'category'));

check('inside 30 yards is short game', () => eq(
  B.classifyShot({ shotNum: 3, par: 5, startLie: 'rough', startDist: 20, startUnit: 'y' }),
  'arg', 'category'));

check('from the green is putting', () => eq(
  B.classifyShot({ shotNum: 2, par: 3, startLie: 'green', startDist: 20, startUnit: 'ft' }),
  'putt', 'category'));

/* --- Strokes gained --------------------------------------------- */

suite('Strokes gained');

check('total is independent of the route taken', () => {
  // Two shots to the green from the same tee, holing from different
  // distances: the intermediate cancels, so the totals must match.
  const a = roundOf([{ par: 4, yards: 400, shots: [
    shot('tee', 400, 'green', 20), shot('green', 20, null, null, { holed: true }),
  ] }]);
  const b = roundOf([{ par: 4, yards: 400, shots: [
    shot('tee', 400, 'green', 5), shot('green', 5, null, null, { holed: true }),
  ] }]);
  const ta = M.roundTotals(a).total;
  const tb = M.roundTotals(b).total;
  return near(ta, tb) ? null : `got ${ta.toFixed(3)} vs ${tb.toFixed(3)}`;
});

check('a penalty costs a stroke in score and in SG', () => {
  const clean = roundOf([{ par: 4, yards: 400, shots: [
    shot('tee', 400, 'fairway', 150), shot('fairway', 150, null, null, { holed: true }),
  ] }]);
  const penal = roundOf([{ par: 4, yards: 400, shots: [
    shot('tee', 400, 'fairway', 150, { penalty: 1 }), shot('fairway', 150, null, null, { holed: true }),
  ] }]);
  const scoreGap = M.roundScore(penal) - M.roundScore(clean);
  const sgGap = M.roundTotals(clean).total - M.roundTotals(penal).total;
  if (scoreGap !== 1) return `score gap ${scoreGap}, expected 1`;
  return near(sgGap, 1) ? null : `sg gap ${sgGap.toFixed(3)}, expected 1`;
});

check('categories sum to the total', () => {
  const r = roundOf([{ par: 4, yards: 400, shots: [
    shot('tee', 400, 'rough', 160), shot('rough', 160, 'green', 24),
    shot('green', 24, 'green', 3), shot('green', 3, null, null, { holed: true }),
  ] }]);
  const t = M.roundTotals(r);
  const sum = B.CATEGORIES.reduce((s, c) => s + t[c], 0);
  return near(sum, t.total) ? null : `sum ${sum.toFixed(3)} vs total ${t.total.toFixed(3)}`;
});

/* --- Editing shots ---------------------------------------------- */

suite('Editing');

check('relink follows an edit through the rest of the hole', () => {
  const r = roundOf([{ par: 4, yards: 400, shots: [
    shot('tee', 400, 'fairway', 150), shot('fairway', 150, 'green', 20),
    shot('green', 20, null, null, { holed: true }),
  ] }]);
  const hole = r.holes[0];
  hole.shots[0].endDist = 120;      // corrected drive
  M.relinkHole(hole);
  return eq(hole.shots[1].startDist, 120, 'second shot start');
});

check('deleting a shot re-points the one after it', () => {
  const r = roundOf([{ par: 4, yards: 400, shots: [
    shot('tee', 400, 'fairway', 150), shot('fairway', 150, 'green', 20),
    shot('green', 20, null, null, { holed: true }),
  ] }]);
  const hole = r.holes[0];
  hole.shots.splice(1, 1);
  M.relinkHole(hole);
  if (hole.shots.length !== 2) return `${hole.shots.length} shots left`;
  return eq(hole.shots[1].startLie, 'fairway', 'putt now starts from');
});

check('relink recomputes whether the hole is finished', () => {
  const r = roundOf([{ par: 3, yards: 160, shots: [
    shot('tee', 160, 'green', 15), shot('green', 15, null, null, { holed: true }),
  ] }]);
  const hole = r.holes[0];
  hole.shots.pop();
  M.relinkHole(hole);
  return hole.done === false ? null : 'hole still marked done';
});

/* --- Sync round trip -------------------------------------------- */

suite('Sync round trip');

// The sheet returns everything as strings, and dates as Date objects.
const asSheet = (obj) => {
  const out = {};
  Object.keys(obj).forEach((k) => {
    const v = obj[k];
    out[k] = (k === 'date' || k === 'finished_at') && v ? new Date(v)
      : (v === '' ? '' : String(v));
  });
  return out;
};

const tripped = (round) => {
  const flat = S.flattenRound(round);
  return S.rebuildRound(asSheet(flat.summary), flat.shots.map(asSheet));
};

check('a full round survives the trip intact', () => {
  const r = roundOf([
    { par: 4, yards: 400, shots: [
      shot('tee', 400, 'rough', 150, { miss: 'right' }),
      shot('rough', 150, 'green', 22, { miss: 'short' }),
      shot('green', 22, 'green', 3), shot('green', 3, null, null, { holed: true }) ] },
    { par: 3, yards: 165, shots: [
      shot('tee', 165, 'sand', 18, { penalty: 1 }),
      shot('sand', 18, 'green', 9), shot('green', 9, null, null, { holed: true }) ] },
  ]);
  const back = tripped(r);
  if (M.roundScore(back) !== M.roundScore(r)) return 'score changed';
  if (M.roundPar(back) !== M.roundPar(r)) return 'par changed';
  if (!near(M.roundTotals(back).total, M.roundTotals(r).total)) return 'strokes gained changed';
  if (back.holes[0].shots[0].miss !== 'right') return 'miss direction lost';
  if (back.holes[1].shots[0].penalty !== 1) return 'penalty lost';
  if (back.holes[0].shots[2].startUnit !== 'ft') return 'feet/yards distinction lost';
  return null;
});

check('a score-only round survives the trip intact', () => {
  const r = roundOf([
    { par: 5, yards: 484, score: 6 },
    { par: 4, yards: 310, score: 4 },
    { par: 3, yards: 165, score: 5 },
  ], 'score');
  const back = tripped(r);
  if (back.mode !== 'score') return `mode came back as ${back.mode}`;
  if (M.roundScore(back) !== 15) return `score ${M.roundScore(back)}, expected 15`;
  if (M.roundPar(back) !== 12) return `par ${M.roundPar(back)}, expected 12`;
  const scores = back.holes.map((h) => h.score).join(',');
  return scores === '6,4,5' ? null : `hole scores ${scores}`;
});

check('a score-only round writes a row per hole', () => {
  // This is the bug that sent a round to nowhere: no shots meant no
  // rows, and the pull skips a round with no rows.
  const r = roundOf([
    { par: 4, yards: 400, score: 5 }, { par: 4, yards: 380, score: 4 },
  ], 'score');
  const flat = S.flattenRound(r);
  if (flat.shots.length !== 2) return `${flat.shots.length} rows, expected 2`;
  return eq(Number(flat.shots[0].shot_num), 0, 'shot_num for a score row');
});

check('score-only rounds are kept out of strokes gained', () => {
  const scoreOnly = roundOf([{ par: 4, yards: 400, score: 5 }], 'score');
  const full = roundOf([{ par: 4, yards: 400, shots: [
    shot('tee', 400, 'green', 20), shot('green', 20, null, null, { holed: true }) ] }]);
  const kept = M.sgRounds([scoreOnly, full]);
  if (kept.length !== 1) return `${kept.length} rounds kept, expected 1`;
  return M.isScoreOnly(kept[0]) ? 'kept the wrong one' : null;
});

/* --- Courses ---------------------------------------------------- */

suite('Courses');

check('one nine played twice builds an 18 hole round', () => {
  const gardner = JSON.parse(JSON.stringify(SEED_COURSES.find((c) => c.id === 'seed_gardner')));
  const full = C.playOptions(gardner).find((o) => o.holeCount === 18);
  const holes = C.buildRoundHoles(gardner, full, 'Blue');
  if (holes.length !== 18) return `${holes.length} holes`;
  if (holes[9].sourceHole !== 1) return `hole 10 came from ${holes[9].sourceHole}`;
  return eq(holes[9].yards, holes[0].yards, 'hole 10 yardage');
});

check('seeded cards total what the scorecards say', () => {
  const gardner = SEED_COURSES.find((c) => c.id === 'seed_gardner');
  const blue = C.nineYardage(gardner.nines[0], 'Blue');
  const sa = SEED_COURSES.find((c) => c.id === 'seed_standrews');
  const black = C.nineYardage(sa.nines[0], 'Black') + C.nineYardage(sa.nines[1], 'Black');
  if (blue !== 3156) return `Gardner blue ${blue}, expected 3156`;
  return black === 6362 ? null : `St Andrews black ${black}, expected 6362`;
});

check('every seeded course passes validation', () => {
  const problems = [];
  SEED_COURSES.forEach((course) => {
    course.teeNames.forEach((tee) => problems.push(...C.validateCourse(course, tee)));
  });
  return problems.length ? problems[0] : null;
});

check('an identical card is spotted under a different name', () => {
  const gardner = JSON.parse(JSON.stringify(SEED_COURSES.find((c) => c.id === 'seed_gardner')));
  const copy = JSON.parse(JSON.stringify(gardner));
  copy.id = 'other';
  copy.name = 'Gardner GC';
  const clash = C.findDuplicate(copy, [gardner]);
  if (!clash) return 'no duplicate reported';
  return eq(clash.kind, 'identical', 'clash kind');
});

/* --- Import ----------------------------------------------------- */

suite('Import');

check('survives markdown fences and chatter', () => {
  const text = "Here you go:\n```json\n" + JSON.stringify({
    name: 'Muni', tees: ['White'],
    nines: [{ name: 'Main', pars: [4, 4, 3, 5, 4, 4, 3, 4, 5],
      yards: { White: [300, 310, 150, 480, 350, 340, 140, 330, 470] } }],
  }) + "\n```";
  const course = I.parseCourseText(text);
  return eq(course.nines[0].holes[3].yards.White, 480, 'hole 4 yardage');
});

check('a nine with no stated pairing gets played twice', () => {
  const course = I.parseCourseText(JSON.stringify({
    name: 'Muni', tees: ['White'],
    nines: [{ name: 'Main', pars: [4, 4, 3, 5, 4, 4, 3, 4, 5],
      yards: { White: [300, 310, 150, 480, 350, 340, 140, 330, 470] } }],
  }));
  if (course.combos.length !== 1) return `${course.combos.length} pairings`;
  return eq(course.combos[0].nineIds[0], course.combos[0].nineIds[1], 'paired with itself');
});

check('a short par row is rejected with a readable reason', () => {
  try {
    I.parseCourseText(JSON.stringify({
      name: 'X', tees: ['Blue'],
      nines: [{ name: 'Front', pars: [4, 4, 3], yards: { Blue: [1, 2, 3, 4, 5, 6, 7, 8, 9] } }],
    }));
    return 'accepted a bad card';
  } catch (err) {
    return err.message.includes('9 numbers') ? null : `unhelpful message: ${err.message}`;
  }
});

check('imported cards are not marked verified', () => {
  const course = I.parseCourseText(JSON.stringify({
    name: 'Muni', tees: ['White'],
    nines: [{ name: 'Main', pars: [4, 4, 3, 5, 4, 4, 3, 4, 5],
      yards: { White: [300, 310, 150, 480, 350, 340, 140, 330, 470] } }],
  }));
  return course.verified === false ? null : 'imported card claimed to be verified';
});

/* --- Records ---------------------------------------------------- */

suite('Records and bests');

check('a drive into trouble does not set the record', () => {
  const r = roundOf([
    { par: 4, yards: 420, shots: [
      shot('tee', 420, 'recovery', 45, { penalty: 1 }),
      shot('recovery', 45, null, null, { holed: true }) ] },
    { par: 4, yards: 400, shots: [
      shot('tee', 400, 'fairway', 145),
      shot('fairway', 145, null, null, { holed: true }) ] },
  ]);
  const best = M.personalBests([r]);
  if (!best.longestDrive) return 'no drive recorded at all';
  return eq(best.longestDrive.yards, 255, 'longest drive');
});

check('a drive into the rough still counts', () => {
  const r = roundOf([{ par: 4, yards: 430, shots: [
    shot('tee', 430, 'rough', 155), shot('rough', 155, null, null, { holed: true }) ] }]);
  const best = M.personalBests([r]);
  return eq(best.longestDrive && best.longestDrive.yards, 275, 'longest drive');
});

check('the same ground played twice counts as one hole', () => {
  const gardner = JSON.parse(JSON.stringify(SEED_COURSES.find((c) => c.id === 'seed_gardner')));
  const full = C.playOptions(gardner).find((o) => o.holeCount === 18);
  const r = M.newRound({
    player: 'Test', courseId: gardner.id, courseName: gardner.name,
    teeName: 'Blue', layout: 'Full 18', holes: C.buildRoundHoles(gardner, full, 'Blue'),
  });
  r.holes.forEach((hole) => {
    hole.shots = [shot('tee', hole.yards, 'green', 20), shot('green', 20, null, null, { holed: true })];
    M.relinkHole(hole);
  });
  const records = M.holeRecords([r]);
  if (records.length !== 9) return `${records.length} distinct holes, expected 9`;
  return records.every((x) => x.plays === 2) ? null : 'plays not counted twice';
});

/* --- Handicap model --------------------------------------------- */

suite('Clubs');

check('club distances come from what the shot advanced', () => {
  const r = roundOf([{ par: 4, yards: 400, shots: [
    shot('tee', 400, 'fairway', 160),
    shot('fairway', 160, 'green', 30, { club: '7i' }),   // 160y - 10y = 150
    shot('green', 30, null, null, { holed: true }) ] }]);
  const clubs = M.clubDistances([r]);
  if (clubs.length !== 1) return `${clubs.length} clubs found`;
  return eq(Math.round(clubs[0].typical), 150, '7i distance');
});

check('a shot with a penalty does not count toward a club', () => {
  const r = roundOf([{ par: 4, yards: 400, shots: [
    shot('tee', 400, 'fairway', 160),
    shot('fairway', 160, 'green', 30, { club: '7i', penalty: 1 }),
    shot('green', 30, null, null, { holed: true }) ] }]);
  return M.clubDistances([r]).length === 0 ? null : 'penalty shot was counted';
});

check('typical is the middle shot, not the average', () => {
  const holes = [90, 150, 152, 154, 156].map((carry) => ({
    par: 4, yards: 400, shots: [
      shot('tee', 400, 'fairway', 200),
      shot('fairway', 200, 'green', (200 - carry) * 3, { club: '7i' }),
      shot('green', (200 - carry) * 3, null, null, { holed: true }) ],
  }));
  const clubs = M.clubDistances([roundOf(holes)]);
  const typical = clubs[0].typical;
  // The 90 yard duff must not drag the number below the cluster.
  return typical >= 150 ? null : `typical ${Math.round(typical)}, expected 150 or more`;
});

check('the histogram puts every shot in exactly one bin', () => {
  const h = M.distanceHistogram([141, 145, 149, 150, 151, 168], 5);
  const total = h.bins.reduce((s, b) => s + b.count, 0);
  return eq(total, 6, 'binned shots');
});

check('gapping spots an overlap and a wide step', () => {
  const clubs = [
    { club: '6i', typical: 170, shots: 5 },
    { club: '7i', typical: 168, shots: 5 },   // 2y — overlapping
    { club: '8i', typical: 140, shots: 5 },   // 28y — wide
  ];
  const { gaps } = M.clubGapping(clubs);
  if (gaps.length !== 2) return `${gaps.length} gaps`;
  if (gaps[0].verdict !== 'overlap') return `first gap read as ${gaps[0].verdict}`;
  return eq(gaps[1].verdict, 'wide', 'second gap');
});

check('clubs with too few shots stay out of gapping', () => {
  const clubs = [
    { club: '6i', typical: 170, shots: 5 },
    { club: '7i', typical: 158, shots: 1 },
    { club: '8i', typical: 146, shots: 4 },
  ];
  const { gaps } = M.clubGapping(clubs, { minShots: 3 });
  if (gaps.length !== 1) return `${gaps.length} gaps, expected 1`;
  return eq(gaps[0].shorter, '8i', 'gap skipped the thin club');
});

suite('Handicap model');

check('the two real rounds land where they should', () => {
  // A 77 came out at -6.6 and a 97 at -26.16 on the same course.
  const low = H.handicapForTotal(-6.6);
  const high = H.handicapForTotal(-26.16);
  if (Math.round(low) !== 4) return `77 mapped to ${low.toFixed(1)}, expected about 4`;
  return Math.round(high) === 27 ? null : `97 mapped to ${high.toFixed(1)}, expected about 27`;
});

check('scratch sits about three strokes behind tour', () => {
  const v = H.expectedSG(0).total;
  return near(v, -3.2, 0.05) ? null : `got ${v}`;
});

check('the weakest category is the one furthest behind', () => {
  const profile = H.handicapProfile({ ott: -1.0, app: -3.6, arg: -0.9, putt: -1.1, total: -6.6 });
  return eq(profile.weakest.category, 'app', 'weakest');
});

/* --- Export ------------------------------------------------------
   The brief is prose, so these check the things a chat would be
   misled by if they were wrong: that the conventions are stated, that
   the numbers in the text match the ones the model computes, and that
   a score-only round never grows strokes-gained detail it has no
   evidence for. */

suite('Export');

/* One bogey and one blow-up, so there is something to take away. */
function exportRound() {
  return roundOf([
    { par: 4, yards: 400, shots: [
      shot('tee', 400, 'fairway', 150, { miss: 'right' }),
      shot('fairway', 150, 'green', 20, { club: '8i', miss: 'short' }),
      shot('green', 20, 'green', 3),
      shot('green', 3, null, null, { holed: true }),
    ] },
    { par: 3, yards: 160, shots: [
      shot('tee', 160, 'green', 25, { club: '7i', miss: 'long-left' }),
      shot('green', 25, 'green', 4),
      shot('green', 4, null, null, { holed: true }),
    ] },
    { par: 4, yards: 380, shots: [
      shot('tee', 380, 'recovery', 200, { miss: 'left', penalty: 1 }),
      shot('recovery', 200, 'rough', 90),
      shot('rough', 90, 'green', 30, { club: 'PW', miss: 'short-right' }),
      shot('green', 30, 'green', 5),
      shot('green', 5, null, null, { holed: true }),
    ] },
    { par: 5, yards: 500, shots: [
      shot('tee', 500, 'fairway', 250, { miss: 'target' }),

/* --- Benchmarks -------------------------------------------------
   The family of handicap-level baselines is CONSTRUCTED, not
   measured, so these are the checks that keep the construction
   honest. If someone touches the shape constants in baseline.js,
   this is the group that says whether they got away with it.
------------------------------------------------------------------ */

suite('Benchmarks');

/* The positions a plain par 72 passes through: four par 3s, ten par
   4s, four par 5s, played to roughly a mid-handicap standard. Written
   as raw geometry rather than a round, because the shape depends only
   on where the ball was and nothing else. */
function canonicalPositions() {
  const ott = [];
  for (let i = 0; i < 10; i++) ott.push(['tee', 385, i < 6 ? 'fairway' : 'rough', 155]);
  for (let i = 0; i < 4; i++) ott.push(['tee', 515, i < 2 ? 'fairway' : 'rough', 265]);

  const app = [];
  for (let i = 0; i < 4; i++) app.push(['tee', 165, i < 2 ? 'green' : 'rough', i < 2 ? 30 : 18]);
  for (let i = 0; i < 10; i++) app.push([i < 6 ? 'fairway' : 'rough', 155, i < 6 ? 'green' : 'rough', i < 6 ? 34 : 16]);
  for (let i = 0; i < 4; i++) app.push([i < 2 ? 'fairway' : 'rough', 265, 'fairway', 95]);
  for (let i = 0; i < 4; i++) app.push(['fairway', 95, i < 3 ? 'green' : 'rough', i < 3 ? 26 : 14]);

  const arg = [];
  for (let i = 0; i < 7; i++) arg.push([i < 5 ? 'rough' : 'sand', i < 5 ? 16 : 12, 'green', 9]);

  const putt = [];
  [30, 34, 26, 30, 34, 26, 28, 32, 24, 22, 9, 9, 9, 9, 9, 9, 9, 14]
    .forEach((d) => putt.push(['green', d, 'green', 3]));
  for (let i = 0; i < 14; i++) putt.push(['green', 3, null, null]);

  return { ott, app, arg, putt };
}

/* Shape delta over a set of shots: what the baseline moves by when
   the level changes. Zero at the finish when the ball was holed. */
const phiOf = (shots) => shots.reduce(
  (sum, [sl, sd, el, ed]) => sum + B.gapShape(sl, sd) - (el ? B.gapShape(el, ed) : 0), 0
);

check('a full round of tee shots is worth one whole gap', () => {
  // THE calibration constant. Everything else is a share of this.
  const tees = [385, 385, 385, 385, 385, 385, 385, 385, 385, 385,
    515, 515, 515, 515, 165, 165, 165, 165];
  const sum = tees.reduce((s, d) => s + B.gapShape('tee', d), 0);
  return near(sum, 1, 0.06) ? null : `tee row sums to ${sum.toFixed(3)}, expected about 1`;
});

check('the shape telescopes: the categories add back up to the tees', () => {
  // Every shot's finish is the next one's start, so the middle terms
  // cancel and only the tee is left. This is what makes total strokes
  // gained against level h equal "what an h would take, minus yours".
  const p = canonicalPositions();
  const total = phiOf(p.ott) + phiOf(p.app) + phiOf(p.arg) + phiOf(p.putt);
  const tees = [385, 385, 385, 385, 385, 385, 385, 385, 385, 385,
    515, 515, 515, 515, 165, 165, 165, 165]
    .reduce((s, d) => s + B.gapShape('tee', d), 0);
  return near(total, tees, 0.02) ? null
    : `categories sum to ${total.toFixed(3)}, tees to ${tees.toFixed(3)}`;
});

check('the gap divides between categories roughly as the model says', () => {
  const p = canonicalPositions();
  const phi = { ott: phiOf(p.ott), app: phiOf(p.app), arg: phiOf(p.arg), putt: phiOf(p.putt) };
  const total = phi.ott + phi.app + phi.arg + phi.putt;
  // The same shares handicap.js splits the gap by. Within a few points
  // is the most that can be asked of a shape built this way — but a
  // long way outside means the constants have drifted.
  const want = { ott: 0.24, app: 0.43, arg: 0.16, putt: 0.17 };
  const off = Object.keys(want)
    .map((c) => ({ c, got: phi[c] / total, want: want[c] }))
    .filter((r) => Math.abs(r.got - r.want) > 0.05);
  return off.length ? off.map((r) => `${r.c} ${r.got.toFixed(2)} vs ${r.want}`).join(', ') : null;
});

check('a level costs exactly the strokes its handicap is expected to lose', () => {
  const r = mediumRound();
  const problems = [];
  [0, 5, 10, 15, 20].forEach((h) => {
    const key = h === 0 ? 'scratch' : 'hcp' + h;
    const shift = M.roundTotals(r, key).total - M.roundTotals(r, 'tour').total;
    // Scaled by how much of a full round this fixture is, since the
    // gap is defined per eighteen holes.
    const scale = M.playedHoles(r).length / 18;
    const want = B.gapForHandicap(h) * scale;
    if (Math.abs(shift - want) > Math.max(0.25, want * 0.15)) {
      problems.push(`${key}: moved ${shift.toFixed(2)}, expected about ${want.toFixed(2)}`);
    }
  });
  return problems.length ? problems.join('; ') : null;
});

check('every level is harder than the one below it, everywhere', () => {
  const spots = [['tee', 400], ['tee', 150], ['fairway', 150], ['fairway', 20],
    ['rough', 90], ['sand', 40], ['recovery', 120], ['green', 30], ['green', 3]];
  for (const [lie, dist] of spots) {
    let previous = -Infinity;
    for (const h of ['tour', 'scratch', 'hcp5', 'hcp10', 'hcp15', 'hcp20']) {
      const value = B.expectedStrokes(lie, dist, h);
      if (value < previous) return `${lie} ${dist} goes backwards at ${h}`;
      previous = value;
    }
  }
  return null;
});

check('an unknown benchmark falls back to tour rather than misreporting', () => {

});

check('nothing derived is written back when the benchmark changes', () => {

check('a day that came back from Sheets as a Date still lands on that day', () => {
  const row = SCH.flattenTeeTime(SCH.newTeeTime({ owner: 'Chris', date: '2026-05-01', time: '08:40' }));
  row.date = new Date(2026, 4, 1, 12, 0);
  row.time = new Date(1899, 11, 30, 8, 40);
  const back = SCH.rebuildTeeTime(row);
  if (back.date !== '2026-05-01') return `date came back as ${back.date}`;
  return eq(back.time, '08:40', 'time');
});

check('the month grid is always six weeks, so the page never reflows', () => {
  const problems = [];
  [[2026, 0], [2026, 1], [2026, 7], [2027, 11]].forEach(([y, m]) => {
    const weeks = SCH.monthGrid(y, m);
    if (weeks.length !== 6) problems.push(`${y}-${m + 1} had ${weeks.length} weeks`);
    if (weeks.some((w) => w.length !== 7)) problems.push(`${y}-${m + 1} had a short week`);
    const inMonth = weeks.flat().filter((d) => d.inMonth).length;
    const expected = new Date(y, m + 1, 0).getDate();
    if (inMonth !== expected) problems.push(`${y}-${m + 1} showed ${inMonth} of ${expected} days`);
  });
  return problems.length ? problems.join('; ') : null;
});

check('the calendar indexes rounds by the local day they were played', () => {
  const r = mediumRound();
  r.date = new Date(2026, 4, 1, 22, 30).toISOString();
  const index = SCH.calendarIndex([], [r]);
  return index.has('2026-05-01') ? null : `indexed under ${[...index.keys()].join(',')}`;
});

check('a calendar file names one event per tee time and reuses its id', () => {
  const a = SCH.newTeeTime({ owner: 'Chris', date: '2026-05-01', time: '08:40', courseName: 'Gardner' });
  const b = SCH.newTeeTime({ owner: 'Chris', date: '2026-05-08', kind: 'practice', practiceType: 'Range' });
  const ics = SCH.toICS([a, b]);
  if ((ics.match(/BEGIN:VEVENT/g) || []).length !== 2) return 'wrong number of events';
  if (!ics.includes(`UID:${a.id}@ledger`)) return 'uid is not the tee time id';
  if (!ics.includes('SUMMARY:Golf')) return 'a round is not named as golf';
  if (!ics.includes('SUMMARY:Range')) return 'practice is not named by its type';
  if (!ics.includes('TRIGGER:-PT60M')) return 'no alarm';
  return null;
});

check('a tee time with no time yet exports as an all-day entry', () => {
  const tt = SCH.newTeeTime({ owner: 'Chris', date: '2026-05-01', courseName: 'Gardner' });
  const ics = SCH.toICS([tt]);
  return ics.includes('DTSTART;VALUE=DATE:20260501') ? null : 'not an all-day event';
});

check('a nine blocks out less of the day than an eighteen', () => {
  const nine = SCH.durationMinutes({ kind: 'round', holes: 9 });
  const full = SCH.durationMinutes({ kind: 'round', holes: 18 });
  const practice = SCH.durationMinutes({ kind: 'practice' });
  if (!(practice < nine && nine < full)) return `${practice}/${nine}/${full}`;
  // A tee time booked before a layout was chosen should assume a full
  // round rather than under-booking the calendar.
  return eq(SCH.durationMinutes({ kind: 'round', holes: null }), full, 'unknown length');
});

check('calendar text is escaped so a comma cannot break the file', () => {
  const tt = SCH.newTeeTime({
    owner: 'Chris', date: '2026-05-01', time: '08:40',
    courseName: 'Hills, The', notes: 'Bring: balls; tees',
  });
  const ics = SCH.toICS([tt]);
  if (!ics.includes('Hills\\, The')) return 'comma not escaped';
  if (!ics.includes('tees') || !/\\;/.test(ics)) return 'semicolon not escaped';
  return null;
});

check('no line in a calendar file exceeds the 75 octet limit', () => {
  const tt = SCH.newTeeTime({
    owner: 'Chris', date: '2026-05-01', time: '08:40',
    courseName: 'A course with a truly excessive name that goes on and on and on',
    notes: 'And a note that keeps going well past any reasonable length, twice over, '
      + 'so that the folding logic is genuinely exercised rather than merely present.',
  });
  const long = SCH.toICS([tt]).split('\r\n').filter((l) => l.length > 75);
  return long.length ? `${long.length} lines too long` : null;
});

/* --- Group rounds --------------------------------------------------- */

suite('Group rounds');

check('rounds played together join up by group id', () => {
  const a = mediumRound(); a.id = 'ra'; a.player = 'Chris'; a.groupId = 'g1';
  const b = mediumRound(); b.id = 'rb'; b.player = 'Kaden'; b.groupId = 'g1';
  const c = mediumRound(); c.id = 'rc'; c.player = 'Manny'; c.groupId = 'g2';
  const board = M.groupLeaderboard([a, b, c], 'g1');
  if (board.length !== 2) return `${board.length} cards, expected 2`;
  return board.every((row) => row.sg) ? null : 'a card lost its strokes gained';
});

check('a round with no group id joins nothing', () => {
  // Every round logged before the calendar existed has none, and they
  // must not all silently become one enormous group.
  const a = mediumRound(); a.id = 'ra'; a.groupId = null;
  const b = mediumRound(); b.id = 'rb'; b.groupId = null;
  return eq(M.roundsInGroup([a, b], null).length, 0, 'joined rounds');
});

check('a score-only card sits in the group with no strokes gained', () => {
  const a = mediumRound(); a.id = 'ra'; a.player = 'Chris'; a.groupId = 'g1';
  const b = roundOf([{ par: 4, yards: 400, score: 6 }], 'score');
  b.id = 'rb'; b.player = 'Kaden'; b.groupId = 'g1';
  const board = M.groupLeaderboard([a, b], 'g1');
  const kaden = board.find((row) => row.player === 'Kaden');
  if (!kaden) return 'the score-only card was dropped';
  return kaden.sg === null ? null : 'a score-only card reported strokes gained';
});

check('a round carries its group id through the sheet', () => {
  const r = mediumRound();
  r.groupId = 'g_abc';
  const back = tripped(r);
  return eq(back.groupId, 'g_abc', 'group id');
});

check('a round with no group id comes back with none, not an empty string', () => {
  const r = mediumRound();
  const back = tripped(r);
  return back.groupId === null ? null : `got ${JSON.stringify(back.groupId)}`;
});

check('a round logged before the calendar existed still works throughout', () => {
  // Not merely groupId: null, but the property absent entirely, which
  // is what every round already in the sheet actually looks like.
  const old = mediumRound();
  delete old.groupId;
  old.schema = 3;

  if (!near(M.roundTotals(old).total, M.roundTotals(mediumRound()).total)) {
    return 'strokes gained changed';
  }
  if (M.roundsInGroup([old], 'g1').length) return 'it joined a group it is not in';
  if (H.impliedHandicaps([old]).overall.handicap == null) return 'no implied handicap';

  const flat = S.flattenRound(old);
  if (flat.summary.group_id !== '') return `group_id written as ${JSON.stringify(flat.summary.group_id)}`;

  // And the reverse: a sheet row from before the column existed.
  const summary = { ...flat.summary };
  delete summary.group_id;
  const back = S.rebuildRound(summary, flat.shots);
  return back.groupId === null ? null : `rebuilt as ${JSON.stringify(back.groupId)}`;
});

/* --- Roster --------------------------------------------------------
   The gate hangs on these. The bug that prompted them: a new player
   typed his name, was turned away, and the message blamed his phone —
   because the roster lived on each device and had never travelled.
-------------------------------------------------------------------- */

suite('Roster');

const SHEET_ROSTER = [
  { player: 'Chris', active: true },
  { player: 'Kaden', active: true },
  { player: 'Dakota', active: true },
  { player: 'Retired Ron', active: false },
];
const LOCAL_ROSTER = ['Chris', 'Kaden', 'Manny'];

check('a name on the sheet gets in', () => eq(
  ST.findInRoster('Dakota', SHEET_ROSTER, LOCAL_ROSTER).status, 'ok', 'status'));

check('case and stray spaces do not keep anybody out', () => {
  const bad = ['dakota', 'DAKOTA', '  Dakota', 'Dakota  ', ' dAkOtA '];
  const wrong = bad.filter((n) => ST.findInRoster(n, SHEET_ROSTER, LOCAL_ROSTER).status !== 'ok');
  return wrong.length ? `rejected ${JSON.stringify(wrong)}` : null;
});

check('the roster decides the spelling, not the person typing', () => eq(
  ST.findInRoster('  dAkOtA ', SHEET_ROSTER, LOCAL_ROSTER).player, 'Dakota', 'canonical name'));

check('an unknown name is missing, not silently allowed', () => eq(
  ST.findInRoster('Stranger', SHEET_ROSTER, LOCAL_ROSTER).status, 'missing', 'status'));

check('an inactive player is turned away as inactive, not as unknown', () => {
  // The two need different sentences at the gate, so they must not
  // collapse into one answer here.
  const found = ST.findInRoster('Retired Ron', SHEET_ROSTER, LOCAL_ROSTER);
  if (found.status !== 'inactive') return `status ${found.status}`;
  return eq(found.player, 'Retired Ron', 'name');
});

check('an empty name is its own answer', () => eq(
  ST.findInRoster('   ', SHEET_ROSTER, LOCAL_ROSTER).status, 'empty', 'status'));

check('the sheet wins over the list baked into the device', () => {
  // Manny is in the local fallback but not on the sheet. Once the
  // sheet has anybody at all, it is the only list that counts —
  // otherwise turning somebody off would never take effect.
  return eq(ST.findInRoster('Manny', SHEET_ROSTER, LOCAL_ROSTER).status, 'missing', 'status');
});

check('an empty sheet falls back rather than locking everyone out', () => {
  // The window between deploying this and anybody filling in the tab.
  // Refusing every name there would be a far worse bug than the one
  // this replaced.
  if (ST.findInRoster('Manny', [], LOCAL_ROSTER).status !== 'ok') return 'fallback did not apply';
  return eq(ST.findInRoster('Stranger', [], LOCAL_ROSTER).status, 'missing', 'unknown name');
});

check('inactive players are left out of the roster everywhere else', () => {
  // Same list feeds the calendar's invitee picker, so somebody
  // switched off must not still be invitable.
  return eq(ST.activeNames(SHEET_ROSTER).join(','), 'Chris,Kaden,Dakota', 'active names');
});

check('a row with active left blank counts as active', () => {
  // Typing just a name into the sheet is the documented way to add
  // somebody, so the other columns being empty has to mean yes.
  const bare = [{ player: 'Dakota' }];
  if (ST.activeNames(bare).length !== 1) return 'blank active read as off';
  return eq(ST.findInRoster('dakota', bare, []).status, 'ok', 'status');
});

/* --- Connecting a device --------------------------------------------
   A setup link works in Safari and does NOT survive Add to Home
   Screen on an iPhone: the icon launches the manifest's start_url,
   which has no query string, and the icon's storage is separate from
   the tab's. So the link has to be pasteable by hand, and this is the
   parsing behind that box.
-------------------------------------------------------------------- */

suite('Connecting a device');

const EXEC = 'https://script.google.com/macros/s/AKfycbxEXAMPLE123/exec';
const SETUP_LINK = `https://example.github.io/Ledger/?s=${
  btoa(EXEC).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '')}`;

check('a whole setup link gives up the sheet address', () => eq(
  S.readSetupText(SETUP_LINK), EXEC, 'url'));

check('the bare /exec address is accepted too', () => eq(
  S.readSetupText(EXEC), EXEC, 'url'));

check('surrounding whitespace does not matter', () => eq(
  S.readSetupText(`  ${SETUP_LINK}\n`), EXEC, 'url'));

check('anything else is refused rather than half-accepted', () => {
  const junk = ['', '   ', 'hello there', 'https://example.com/', SETUP_LINK.replace(/s=.*/, 's=!!!!')];
  const wrong = junk.filter((t) => S.readSetupText(t) !== null);
  return wrong.length ? `accepted ${JSON.stringify(wrong)}` : null;
});

check('a link pointing somewhere that is not Apps Script is refused', () => {
  // The address is not a secret, but it is still the thing every
  // round on this phone would get posted to.
  const evil = 'https://evil.example.com/macros/s/x/exec';
  if (S.readSetupText(evil) !== null) return 'accepted a foreign host';
  const wrapped = `https://example.github.io/?s=${
    btoa(evil).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '')}`;
  return S.readSetupText(wrapped) === null ? null : 'accepted a foreign host inside a link';
});

/* --- Scorecard repair ----------------------------------------------
   A round stores the yardages it was played against, so correcting a
   course does nothing for rounds already on it. These cover the real
   case: Iron Horse holes 8 and 9 transposed — a par 4 at 530 and a
   par 5 at 306 — with three players scored against the bad card.
-------------------------------------------------------------------- */

suite('Scorecard repair');

/* Built as a literal rather than through upsertCourse, because
   nothing in this file may touch storage. */
function ironHorse(rows) {
  return {
    id: 'iron_horse',
    name: 'Iron Horse',
    city: '',
    verified: true,
    teeNames: ['White'],
    combos: [],
    nines: [{
      id: 'ih_main',
      name: 'Main',
      holes: rows.map(([par, yards], i) => ({ hole: i + 1, par, yards: { White: yards } })),
    }],
  };
}

const IH_WRONG = [[4, 380], [4, 410], [3, 165], [5, 505], [4, 395], [4, 350], [3, 190], [4, 530], [5, 306]];
const IH_RIGHT = [[4, 380], [4, 410], [3, 165], [5, 505], [4, 395], [4, 350], [3, 190], [4, 306], [5, 530]];

/** A nine-hole round played against whichever card is passed in. */
function ironHorseRound(rows, player = 'Chris') {
  const r = roundOf(rows.map(([par, yards]) => ({
    par,
    yards,
    shots: [
      shot('tee', yards, 'fairway', 60),
      shot('fairway', 60, 'green', 18),
      shot('green', 18, 'green', 2),
      shot('green', 2, null, null, { holed: true }),
    ],
  })));
  r.player = player;
  r.courseId = 'iron_horse';
  r.courseName = 'Iron Horse';
  r.teeName = 'White';
  return r;
}

check('the layout is worked out from the pars, not from the round', () => {
  // It has to be, because sourceNine and layout do not survive the
  // sheet — anybody else's round arrives without them, and those are
  // exactly the rounds that need repairing.
  const round = ironHorseRound(IH_WRONG);
  delete round.layout;
  round.holes.forEach((h) => { delete h.sourceNine; delete h.sourceHole; });
  const found = RP.inferPlayOption(ironHorse(IH_RIGHT), round);
  return found.status === 'exact' ? null : `status ${found.status}`;
});

check('a transposed pair is spotted and both holes reported', () => {
  const plan = RP.planRoundRepair(ironHorseRound(IH_WRONG), ironHorse(IH_RIGHT));
  if (!plan.ok) return plan.reason;
  if (!plan.changed) return 'reported nothing to change';
  const moved = plan.holes.map((h) => `${h.hole}:${h.from}->${h.to}`).join(' ');
  return moved === '8:530->306 9:306->530' ? null : moved;
});

check('the per-hole strokes gained moves even when the round total does not', () => {
  // The whole trap: two holes swapped move by equal and opposite
  // amounts, so a report showing only round totals would say a real
  // error had no effect.
  const plan = RP.planRoundRepair(ironHorseRound(IH_WRONG), ironHorse(IH_RIGHT));
  const eight = plan.holes.find((h) => h.hole === 8);
  const nine = plan.holes.find((h) => h.hole === 9);
  const d8 = eight.sgAfter - eight.sgBefore;
  const d9 = nine.sgAfter - nine.sgBefore;
  if (Math.abs(d8) < 1) return `hole 8 barely moved: ${d8.toFixed(2)}`;
  if (!near(d8, -d9, 0.01)) return `holes moved by ${d8.toFixed(2)} and ${d9.toFixed(2)}`;
  return near(plan.after.total - plan.before.total, 0, 0.01)
    ? null : 'the round total moved when it should have cancelled';
});

check('repairing pulls the tee shot along with the hole', () => {
  // The one value that was wrong. Every later shot started where the
  // previous one finished, and those were typed in by hand.
  const round = ironHorseRound(IH_WRONG);
  const plan = RP.planRoundRepair(round, ironHorse(IH_RIGHT));
  const fixed = plan.repaired;
  if (fixed.holes[7].yards !== 306) return `hole 8 yards ${fixed.holes[7].yards}`;
  if (fixed.holes[7].shots[0].startDist !== 306) return `tee shot ${fixed.holes[7].shots[0].startDist}`;
  // And nothing downstream was disturbed.
  return eq(fixed.holes[7].shots[1].startDist, 60, 'second shot start');
});

check('scores are not touched by a repair', () => {
  const round = ironHorseRound(IH_WRONG);
  const plan = RP.planRoundRepair(round, ironHorse(IH_RIGHT));
  if (M.roundScore(plan.repaired) !== M.roundScore(round)) return 'score changed';
  return eq(M.roundToPar(plan.repaired), M.roundToPar(round), 'to par');
});

check('running it on an already-correct round is a no-op', () => {
  const plan = RP.planRoundRepair(ironHorseRound(IH_RIGHT), ironHorse(IH_RIGHT));
  if (!plan.ok) return plan.reason;
  return plan.changed ? 'reported a change against a matching card' : null;
});

check('running it twice changes nothing the second time', () => {
  const rounds = [ironHorseRound(IH_WRONG, 'Chris'), ironHorseRound(IH_WRONG, 'Kaden')];
  rounds.forEach((r, i) => { r.id = 'r' + i; });
  const course = ironHorse(IH_RIGHT);
  const first = RP.planRepair(rounds, () => course);
  if (first.changed.length !== 2) return `first pass fixed ${first.changed.length}`;
  const second = RP.planRepair(first.changed.map((p) => p.repaired), () => course);
  return second.changed.length === 0 ? null : `second pass wanted ${second.changed.length} more`;
});

check('everybody who played the bad card is repaired in one go', () => {
  // Three players, one invocation. Asking each of them to run it on
  // their own phone would mean two of them never did.
  const rounds = ['Chris', 'Kaden', 'Manny'].map((p, i) => {
    const r = ironHorseRound(IH_WRONG, p);
    r.id = 'r' + i;
    return r;
  });
  const result = RP.planRepair(rounds, () => ironHorse(IH_RIGHT));
  return eq(result.changed.map((p) => p.player).join(','), 'Chris,Kaden,Manny', 'players repaired');
});

check('a par that disagrees is reported and left alone', () => {
  // Changing par rewrites the score-to-par of a round somebody
  // actually played. That is a deliberate act, not a side effect.
  const wrongPar = IH_RIGHT.map((row, i) => (i === 0 ? [5, row[1]] : row));
  const round = ironHorseRound(IH_RIGHT);
  const plan = RP.planRoundRepair(round, ironHorse(wrongPar));
  // Pars no longer match any layout, so it refuses rather than guessing.
  return plan.ok === false ? null : 'silently accepted a round whose pars do not match';
});

check('a missing course is refused with a reason, not skipped', () => {
  const result = RP.planRepair([ironHorseRound(IH_WRONG)], () => null);
  if (result.blocked.length !== 1) return 'not reported as blocked';
  return result.blocked[0].reason ? null : 'blocked without saying why';
});

check('a tee that is not on the card is refused rather than guessed', () => {
  const round = ironHorseRound(IH_WRONG);
  round.teeName = 'Gold';
  const plan = RP.planRoundRepair(round, ironHorse(IH_RIGHT));
  return plan.ok === false ? null : 'accepted a tee the course does not have';
});

/* --- Course sanity warnings ----------------------------------------- */

suite('Course warnings');

check('a par 4 at 530 yards is flagged', () => {
  // The one that would have caught this at entry.
  const warnings = C.yardageWarnings(ironHorse(IH_WRONG), 'White');
  return warnings.some((w) => /hole 8/.test(w) && /530/.test(w))
    ? null : `got ${JSON.stringify(warnings)}`;
});

check('a par 5 at 306 yards is flagged too', () => {
  const warnings = C.yardageWarnings(ironHorse(IH_WRONG), 'White');
  return warnings.some((w) => /hole 9/.test(w) && /306/.test(w))
    ? null : `got ${JSON.stringify(warnings)}`;
});

check('a correct card produces no noise at all', () => {
  // A warning that cries wolf on a normal scorecard gets ignored, and
  // then it is not there when it matters.
  const warnings = C.yardageWarnings(ironHorse(IH_RIGHT), 'White');
  return warnings.length ? `warned about ${JSON.stringify(warnings)}` : null;
});

check('a par 4 longer than a par 5 is called out as possibly swapped', () => {
  // The strongest signal, and the one that matches the shape of this
  // bug. Absolute bands have to stay loose enough for forward tees;
  // comparing pars against each other does not, because whatever the
  // tee, the par 5s are the long holes.
  const warnings = C.yardageWarnings(ironHorse(IH_WRONG), 'White');
  return warnings.some((w) => /right way round/.test(w))
    ? null : `got ${JSON.stringify(warnings)}`;
});

check('every seeded course passes without a warning', () => {
  // These were transcribed from the paper cards, so any warning here
  // is the check being too fussy rather than the card being wrong.
  const noisy = [];
  SEED_COURSES.forEach((course) => {
    (course.teeNames || []).forEach((tee) => {
      C.yardageWarnings(course, tee).forEach((w) => noisy.push(`${course.name} ${tee}: ${w}`));
    });
  });
  return noisy.length ? noisy.slice(0, 3).join(' | ') : null;
});

/* --- Render ----------------------------------------------------- */

const byGroup = {};
results.forEach((r) => {
  if (!byGroup[r.group]) byGroup[r.group] = [];
  byGroup[r.group].push(r);
});

const passed = results.filter((r) => r.ok).length;
const failed = results.length - passed;

document.getElementById('app').innerHTML = `
  <div class="card">
    <h2>${failed ? `${failed} failing` : 'All passing'}</h2>
    <p class="muted">${passed} of ${results.length} checks passed.</p>
  </div>
  ${Object.keys(byGroup).map((name) => `
    <div class="card">
      <div class="group">${name}</div>
      ${byGroup[name].map((r) => `
        <div class="t ${r.ok ? 'pass' : 'fail'}">
          <span class="mark">${r.ok ? '✓' : '✕'}</span>
          <span>${r.name}${r.why ? `<br><span class="why">${r.why}</span>` : ''}</span>
        </div>`).join('')}
    </div>`).join('')}
`;

document.title = failed ? `${failed} failing — Ledger tests` : 'All passing — Ledger tests';
</script>
